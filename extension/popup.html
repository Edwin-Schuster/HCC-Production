<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HCC SOPs</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body { width: 380px; padding: 12px; }
    </style>
  </head>
  <body>
    <div class="row">
      <img src="icons/icon-32.png" width="18" height="18" alt="" />
      <h1 class="grow">HCC SOPs</h1>
      <a href="options.html" target="_blank" class="muted">Settings</a>
    </div>
    <p id="setup" class="muted" hidden>Open <a href="options.html" target="_blank">Settings</a> and add your HCC address and an API key from your profile.</p>

    <section id="main" hidden>
      <h2>For this page</h2>
      <div id="matches" class="muted">Looking…</div>

      <h2>Search</h2>
      <form id="search" class="row"><input id="q" placeholder="Search SOPs" autocomplete="off" /><button>Go</button></form>
      <div id="results"></div>

      <h2>Record a new SOP</h2>
      <div id="recorder"></div>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
